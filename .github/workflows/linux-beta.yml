name: Linux beta packages
on:
  workflow_dispatch:
  push:
    branches: [linux-beta]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Extract verified Linux vendor fixture
        run: |
          python3 -m venv /tmp/fixture-tools
          /tmp/fixture-tools/bin/pip install dissect.squashfs==1.10 zstandard==0.25.0
          /tmp/fixture-tools/bin/python scripts/linux-fixture.py
      - run: npm test
        env:
          ORCA_FIXTURE: /tmp/snorca-linux-fixture
      - run: npm audit --omit=dev
      - name: Package Linux x64
        run: npm run package:linux -- --publish never --config.directories.output=dist-linux
      - run: npm run verify:package -- dist-linux/linux-unpacked/resources/app.asar
      - name: Verify Debian metadata and create stable beta copies
        run: |
          dpkg-deb --info dist-linux/*.deb
          cp dist-linux/Snorca-After-Dark-0.3.1-beta.1-linux-x64.AppImage dist-linux/Snorca-After-Dark-Linux-x64.AppImage
          cp dist-linux/Snorca-After-Dark-0.3.1-beta.1-linux-x64.deb dist-linux/Snorca-After-Dark-Linux-x64.deb
          cd dist-linux
          sha256sum *.AppImage *.deb > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: snorca-linux-beta
          path: |
            dist-linux/*.AppImage
            dist-linux/*.deb
            dist-linux/SHA256SUMS.txt
